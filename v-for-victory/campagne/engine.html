<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Force de campagne</title></head><body><p>Chargement de la force…</p><script>
(async()=>{try{const base=new URL('../',location.href),bridge=new URL('bridge.js',location.href).href;const response=await fetch(new URL('index.html',base),{cache:'no-cache'});if(!response.ok)throw Error('Moteur indisponible');let html=await response.text();html=html.replace('<head>','<head><base href="'+base.href+'">');const scripts='<script src="'+bridge+'"><'+'/script>';html=html.replace('</body>',scripts+'</body>');document.open();document.write(html);document.close();}catch(error){document.body.textContent='Impossible de charger le recrutement de campagne : '+error.message;}})();
</script></body></html>
